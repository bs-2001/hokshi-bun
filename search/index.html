<section class="section">
  <div class="section-header">
    <h1 class="section-title">搜索文章</h1>
  </div>

  <div class="search-box">
    <input type="text" id="search-input" class="search-input"
           placeholder="搜索文章..." autofocus autocomplete="off">
  </div>

  <div id="search-results" class="post-list"></div>
</section>

<script>
(function () {
  var input = document.getElementById("search-input");
  var results = document.getElementById("search-results");
  var posts = [];
  var sitePath = "";
  var emptyHtml = '<p class="search-empty">没有找到文章</p>';

  fetch(sitePath + "/search.json")
    .then(function (r) { return r.json(); })
    .then(function (data) {
      posts = data;
      if (input.value) doSearch();
    });

  function doSearch() {
    var q = input.value.trim().toLowerCase();
    if (!q) { results.innerHTML = ""; return; }

    var matched = posts.filter(function (p) {
      return p.title.toLowerCase().indexOf(q) !== -1 ||
        (p.desc && p.desc.toLowerCase().indexOf(q) !== -1) ||
        p.tags.some(function (t) { return t.toLowerCase().indexOf(q) !== -1; }) ||
        p.category.toLowerCase().indexOf(q) !== -1;
    });

    if (matched.length === 0) {
      results.innerHTML = emptyHtml;
      return;
    }

    results.innerHTML = matched.map(function (p) {
      return '<article class="post-item">' +
        '<h2 class="post-title"><a href="' + sitePath + '/' + enc(p.category) + '/' + enc(p.slug) + '/" class="post-link">' + esc(p.title) + '</a></h2>' +
        '<div class="post-meta">' +
          '<time>' + p.date + '</time>' +
          '<span class="meta-sep">&bull;</span>' +
          '<a href="' + sitePath + '/category/' + enc(p.category) + '.html" class="post-cat">' + p.category + '</a>' +
        '</div>' +
        (p.desc ? '<p class="post-desc">' + esc(p.desc) + '</p>' : '') +
        '<div class="post-tags">' + p.tags.map(function (t) { return '<a href="' + sitePath + '/tags/#' + enc(t) + '" class="tag-link">#' + esc(t) + '</a>'; }).join("") + '</div>' +
      '</article>';
    }).join("");
  }

  function esc(s) {
    return s.replace(/&/g, "&amp;").replace(/</g, "&lt;").replace(/>/g, "&gt;").replace(/"/g, "&quot;");
  }

  function enc(s) {
    return encodeURIComponent(s);
  }

  input.addEventListener("input", doSearch);
})();
</script>
